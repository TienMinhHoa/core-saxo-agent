[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "saxophone-rag-backend"
version = "0.1.0"
description = "PDF extraction and music RAG backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=0.5,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "openai>=1,<3",
    "python-dotenv>=1,<2",
    "python-multipart>=0.0.9,<1",
    "tiktoken>=0.7,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
paddle-client = [
    "paddleocr[doc-parser]>=3.3,<4",
    "paddlepaddle>=3.2.1,<4",
]

[project.scripts]
saxophone-api = "saxophone.main:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["saxophone*"]
namespaces = true

[tool.setuptools.package-data]
"saxophone.interfaces" = [
    "api/assets/chat/*.html",
    "api/assets/chat/*.css",
    "api/assets/chat/*.js",
    "api/assets/db/*.html",
    "api/assets/db/*.css",
    "api/assets/db/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
