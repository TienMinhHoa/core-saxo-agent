[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "saxophone-rag-backend"
version = "0.1.0"
description = "PDF extraction and music RAG backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=0.5,<2",
    "fastapi>=0.115,<1",
    "openai>=1,<3",
    "python-dotenv>=1,<2",
    "python-multipart>=0.0.9,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
legacy-ui = [
    "gradio>=5,<6",
]

[project.scripts]
music-rag = "music_rag.cli:main"
pdf-layout-web = "pdf_layout_web:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["pdf_layout_web"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["music_rag*", "extracted*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
